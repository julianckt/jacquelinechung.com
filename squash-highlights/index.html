        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background-color: #F7E6F2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 32px;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #3D58F2;
            font-family: "panel-mono", monospace;
            font-weight: 700;
            font-size: 32px;
            text-align: center;
            margin: 0;
            line-height: 1.35;
            -webkit-text-stroke: 10px #ffffff;
            paint-order: stroke fill;
        }

        .highlight-button {
            display: inline-block;
            width: 100%;
            max-width: 440px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 0;
            border-radius: 9999px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .highlight-button:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 8px 20px rgba(4, 191, 138, 0.35));
        }

        .highlight-button:active {
            transform: scale(0.98);
        }

        .highlight-button:focus-visible {
            outline: 3px solid #3D58F2;
            outline-offset: 4px;
        }

        .highlight-button svg {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
